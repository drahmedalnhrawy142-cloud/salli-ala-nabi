name: Android APK

on:
  push:
    branches:
      - mobile-app
      - floating-button

permissions:
  contents: read

jobs:
  apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Check Supabase settings exist
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          test -n "$SUPABASE_URL" || { echo "Missing GitHub secret: NEXT_PUBLIC_SUPABASE_URL"; exit 1; }
          test -n "$SUPABASE_KEY" || { echo "Missing GitHub secret: NEXT_PUBLIC_SUPABASE_ANON_KEY"; exit 1; }

      - name: Install dependencies
        run: npm install

      - name: Build web app (static export)
        env:
          BUILD_TARGET: mobile
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Create Android project, app icons, and sync
        run: |
          if [ ! -d android ]; then npx cap add android; fi
          npx capacitor-assets generate --android
          npx cap sync android

      - name: Add floating button (native Android code)
        run: python3 native/patch_android.py

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: salli-ala-nabi-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
