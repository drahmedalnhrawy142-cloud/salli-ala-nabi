name: Android Release (Google Play AAB)

on:
  push:
    branches:
      - release

permissions:
  contents: read

jobs:
  aab:
    name: Build release AAB
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Check Supabase settings exist
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          test -n "$SUPABASE_URL" || { echo "Missing GitHub secret: NEXT_PUBLIC_SUPABASE_URL"; exit 1; }
          test -n "$SUPABASE_KEY" || { echo "Missing GitHub secret: NEXT_PUBLIC_SUPABASE_ANON_KEY"; exit 1; }

      - name: Install dependencies
        run: npm install

      - name: Build web app (static export)
        env:
          BUILD_TARGET: mobile
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Create Android project, app icons, and sync
        run: |
          if [ ! -d android ]; then npx cap add android; fi
          npx capacitor-assets generate --android
          npx cap sync android

      - name: Add native Android code
        run: python3 native/patch_android.py

      - name: Prepare upload keystore (if secrets exist)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.keystore"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/upload.keystore" >> "$GITHUB_ENV"
          else
            echo "No ANDROID_KEYSTORE_BASE64 secret: the bundle will be UNSIGNED."
          fi

      - name: Set version and signing
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: python3 native/patch_release.py

      - name: Build release bundle
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease assembleRelease

      - name: Upload AAB (Google Play)
        uses: actions/upload-artifact@v4
        with:
          name: salli-ala-nabi-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Upload APK (Huawei AppGallery / Samsung Galaxy Store / direct install)
        uses: actions/upload-artifact@v4
        with:
          name: salli-ala-nabi-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
